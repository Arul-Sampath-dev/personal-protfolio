<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020308"/>
      <stop offset="60%" stop-color="#090d22"/>
      <stop offset="100%" stop-color="#04050e"/>
    </linearGradient>
    <pattern id="gridDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#canvasBg)"/>
  <rect width="800" height="450" fill="url(#gridDots)"/>

  <!-- Left Sidebar (Tool panel) -->
  <rect x="0" y="0" width="200" height="450" fill="rgba(255, 255, 255, 0.015)" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <text x="25" y="35" font-family="sans-serif" font-weight="900" font-size="14" fill="#e0e7ff" letter-spacing="1">AGENT BUILDER</text>
  
  <text x="25" y="80" font-family="sans-serif" font-weight="bold" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">DRAGGABLE NODES</text>

  <!-- Node lists in panel -->
  <g transform="translate(15, 100)">
    <!-- Node item 1 -->
    <rect x="0" y="0" width="170" height="34" rx="6" fill="rgba(99, 102, 241, 0.1)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#6366f1"/>
    <text x="40" y="21" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c7d2fe">Gemini API Router</text>
  </g>

  <g transform="translate(15, 145)">
    <!-- Node item 2 -->
    <rect x="0" y="0" width="170" height="34" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#10b981"/>
    <text x="40" y="21" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">System Prompt</text>
  </g>

  <g transform="translate(15, 190)">
    <!-- Node item 3 -->
    <rect x="0" y="0" width="170" height="34" rx="6" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#f59e0b"/>
    <text x="40" y="21" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fde68a">Custom Tool</text>
  </g>

  <g transform="translate(15, 235)">
    <!-- Node item 4 -->
    <rect x="0" y="0" width="170" height="34" rx="6" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#ef4444"/>
    <text x="40" y="21" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">Database Connector</text>
  </g>

  <!-- Top bar status -->
  <rect x="200" y="0" width="600" height="50" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="230" cy="25" r="4" fill="#22c55e"/>
  <text x="245" y="29" font-family="sans-serif" font-size="12" fill="#fff" font-weight="500">Live Workspace: dev_environment_alpha</text>
  <rect x="650" y="10" width="120" height="30" rx="6" fill="#6366f1"/>
  <text x="710" y="29" font-family="sans-serif" font-weight="bold" font-size="11" fill="#fff" text-anchor="middle">Deploy Agent</text>

  <!-- Large Interactive Canvas flow on the right -->
  <!-- Connection Curve -->
  <path d="M 390 180 Q 480 180 480 250" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
  <path d="M 590 135 H 640" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 3"/>
  <path d="M 480 280 V 320" stroke="#10b981" stroke-width="2.5"/>

  <!-- Node 1: Input Trigger -->
  <g transform="translate(240, 140)">
    <rect x="0" y="0" width="150" height="80" rx="10" fill="#0b1330" stroke="#6366f1" stroke-width="2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
    <text x="15" y="25" font-family="sans-serif" font-size="11" fill="#a5b4fc" font-weight="bold">System Instruction</text>
    <text x="15" y="45" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">"Act as a security</text>
    <text x="15" y="60" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">analyst scanner..."</text>
    <circle cx="150" cy="40" r="5" fill="#6366f1"/>
  </g>

  <!-- Node 2: LLM Gate (Gemini Flash) -->
  <g transform="translate(420, 240)">
    <rect x="0" y="0" width="170" height="80" rx="10" fill="#082b3a" stroke="#0ea5e9" stroke-width="2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
    <!-- Glow border -->
    <text x="15" y="25" font-family="sans-serif" font-size="11" fill="#7dd3fc" font-weight="bold">🧠 Gemini API Router</text>
    <text x="15" y="47" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.6)">Model: gemini-3.5-flash</text>
    <rect x="15" y="58" width="80" height="15" rx="3" fill="#0ea5e9" opacity="0.2"/>
    <text x="55" y="69" font-family="sans-serif" font-size="8" fill="#38bdf8" text-anchor="middle">Temp: 0.15 (Strict)</text>
    <circle cx="0" cy="40" r="5" fill="#6366f1"/>
    <circle cx="170" cy="35" r="5" fill="#f59e0b"/>
    <circle cx="85" cy="80" r="5" fill="#10b981"/>
  </g>

  <!-- Node 3: Custom DB Node -->
  <g transform="translate(640, 100)">
    <rect x="0" y="0" width="130" height="70" rx="8" fill="#1e180d" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="15" y="22" font-family="sans-serif" font-size="10" fill="#fef08a" font-weight="bold">Database Tool</text>
    <text x="15" y="42" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Write Log Endpoint</text>
    <text x="15" y="54" font-family="monospace" font-size="8" fill="#a78bfa">psql --insert-logs</text>
    <circle cx="0" cy="35" r="4" fill="#f59e0b"/>
  </g>

  <!-- Node 4: Webhook Response -->
  <g transform="translate(420, 360)">
    <rect x="10" y="0" width="150" height="50" rx="8" fill="#082b1c" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="20" font-family="sans-serif" font-size="10" fill="#a7f3d0" font-weight="bold">Webhook Dispatcher</text>
    <text x="25" y="36" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">POST: api/deployment</text>
    <circle cx="85" cy="0" r="4" fill="#10b981"/>
  </g>
</svg>
