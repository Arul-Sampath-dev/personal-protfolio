<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#gBg)"/>

  <!-- Process Diagram: Thread Synchronization Thread Safe Block -->
  <text x="50" y="45" font-family="monospace" font-size="12" fill="#a5b4fc">[MONITOR] Java Object Lock Stack / Thread-Safe Transaction Dispatcher</text>

  <!-- Left Module Box: Source Account -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="190" height="180" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="30" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fff">SavingsAccount.java</text>
    <rect x="25" y="45" width="140" height="1" fill="rgba(255,255,255,0.1)"/>
    
    <text x="20" y="70" font-family="monospace" font-size="10" fill="#fca5a5">- balance: double</text>
    <text x="20" y="90" font-family="monospace" font-size="10" fill="#a7f3d0">+ deduct(double): void</text>
    <text x="20" y="110" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)">- lockState: Object</text>

    <!-- State Indicator -->
    <rect x="20" y="140" width="150" height="24" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="95" y="156" font-family="monospace" font-size="9" fill="#10b981" font-weight="bold" text-anchor="middle">THREAD SAFE / FREE</text>
  </g>

  <!-- Middle block: Synchronized Lock Barrier -->
  <g transform="translate(290, 80)">
    <path d="M 45 40 Q 110 90 110 160 Q 110 230 45 280" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4"/>
    <rect x="55" y="125" width="110" height="80" rx="10" fill="#2d1a0d" stroke="#fbbf24" stroke-width="2" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))"/>
    <text x="110" y="150" font-family="monospace" font-weight="bold" font-size="11" fill="#fef08a" text-anchor="middle">synchronized</text>
    <text x="110" y="165" font-family="monospace" font-size="9" fill="#facc15" text-anchor="middle">(accountLock)</text>
    <text x="110" y="186" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle">Prevents race checks</text>
  </g>

  <!-- Right Module Box: Target Account -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="190" height="180" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="30" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fff">CheckingAccount.java</text>
    <rect x="25" y="45" width="140" height="1" fill="rgba(255,255,255,0.1)"/>
    
    <text x="20" y="70" font-family="monospace" font-size="10" fill="#fca5a5">- balance: double</text>
    <text x="20" y="90" font-family="monospace" font-size="10" fill="#a7f3d0">+ deposit(double): void</text>
    <text x="20" y="110" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)">- lockState: Object</text>

    <!-- State Indicator -->
    <rect x="20" y="140" width="150" height="24" rx="4" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1"/>
    <text x="95" y="156" font-family="monospace" font-size="9" fill="#3b82f6" font-weight="bold" text-anchor="middle">MUTEX LOCKED (Thread B)</text>
  </g>

  <!-- Flow Arrows connecting segments -->
  <path d="M 250 190 H 335" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <polygon points="342,190 334,186 334,194" fill="#10b981" />

  <path d="M 465 190 H 530" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="537,190 529,186 529,194" fill="#3b82f6" />

  <!-- Console Log details underneath -->
  <rect x="60" y="300" width="670" height="100" rx="8" fill="#070a13" stroke="rgba(255,255,255,0.04)"/>
  <text x="80" y="325" font-family="monospace" font-size="10" fill="#38bdf8">thread_pool-7: Acquiring lock for SavingsAccount@4fac19 (DEDUCTING $500.00)</text>
  <text x="80" y="345" font-family="monospace" font-size="10" fill="#fbbf24">thread_pool-7: Thread lock achieved under monitor scope. Beginning double-entry audit write.</text>
  <text x="80" y="365" font-family="monospace" font-size="10" fill="#22c55e">thread_pool-7: Transfer dispatch success. Balancing checksum computed: 0.00000000 | Lock released.</text>
</svg>
