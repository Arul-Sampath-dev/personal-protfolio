<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="adminBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05010c"/>
      <stop offset="100%" stop-color="#14021f"/>
    </linearGradient>
    <linearGradient id="revenueGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="rgba(192, 38, 211, 0.0)"/>
