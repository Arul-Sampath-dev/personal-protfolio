    <text x="320" y="16" font-family="monospace" font-size="10" fill="#ec4899">PPT PLATINUM</text>
    <text x="490" y="15" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)">Txn: cf_74381029z</text>
    <rect x="610" y="3" width="70" height="18" rx="4" fill="rgba(16,185,129,0.15)"/>
    <text x="645" y="15" font-family="sans-serif" font-weight="bold" font-size="8" fill="#10b981" text-anchor="middle">CONFIRMED</text>
  </g>
  <line x1="60" y1="315" x2="740" y2="315" stroke="rgba(255,255,255,0.03)"/>

  <!-- Row 3 -->
  <g transform="translate(60, 330)">
    <circle cx="10" cy="12" r="4" fill="#3b82f6"/>
    <text x="30" y="16" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">Arjun Prasad (VIT Vellore)</text>
    <text x="320" y="16" font-family="monospace" font-size="10" fill="#ec4899">PROMPT CRAFT</text>
    <text x="490" y="15" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)">Txn: cf_74381033b</text>
