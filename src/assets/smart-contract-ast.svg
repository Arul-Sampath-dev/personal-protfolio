<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0b1129"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="glow-danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Glowing background elements -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.1" filter="blur(80px)"/>
  <circle cx="600" cy="300" r="150" fill="#0ea5e9" opacity="0.08" filter="blur(60px)"/>

  <!-- Code Header Box -->
  <rect x="30" y="30" width="740" height="40" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="50" cy="50" r="5" fill="#ef4444"/>
  <circle cx="65" cy="50" r="5" fill="#eab308"/>
  <circle cx="80" cy="50" r="5" fill="#22c55e"/>
  <text x="110" y="55" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.4)">AST Representation: solidity_sensing_tree_ast.json</text>

  <!-- Left Side: Source Abstract Code representation -->
  <rect x="30" y="90" width="310" height="330" rx="12" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.05)"/>
  <text x="50" y="125" font-family="monospace" font-size="12" fill="#818cf8">contract ConsenseSecurity {</text>
  <text x="70" y="150" font-family="monospace" font-size="12" fill="#38bdf8">  mapping(address =&gt; uint) userBalances;</text>
  <text x="70" y="185" font-family="monospace" font-size="12" fill="#facc15">  function withdrawAll() public {</text>
  <text x="90" y="210" font-family="monospace" font-size="12" fill="#01f2ff">    uint amt = userBalances[msg.sender];</text>
  <text x="90" y="235" font-family="monospace" font-size="12" fill="#f43f5e" font-weight="bold">    (bool success, ) = msg.sender.call{value: amt}("");</text>
  <text x="90" y="260" font-family="monospace" font-size="12" fill="#10b981">    // VULNERABLE: state updated after external call!</text>
  <text x="90" y="285" font-family="monospace" font-size="12" fill="#f43f5e">    userBalances[msg.sender] = 0;</text>
  <text x="70" y="310" font-family="monospace" font-size="12" fill="#facc15">  }</text>
  <text x="50" y="335" font-family="monospace" font-size="12" fill="#818cf8">}</text>

  <!-- Neural Connection / AST Nodes on the Right -->
  <!-- Main Node (withdrawAll) -->
  <line x1="340" y1="210" x2="430" y2="210" stroke="rgba(255, 255, 255, 0.2)" stroke-dasharray="4"/>
  
  <g class="node">
    <circle cx="480" cy="210" r="35" fill="rgba(99, 102, 241, 0.1)" stroke="#6366f1" stroke-width="2"/>
    <text x="480" y="214" font-family="sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">withdrawAll</text>
  </g>

  <!-- Sub Node: Load Balance -->
  <line x1="480" y1="175" x2="480" y2="120" stroke="#0ea5e9" stroke-width="2"/>
  <g class="node">
    <rect x="420" y="85" width="120" height="35" rx="6" fill="rgba(14, 165, 233, 0.1)" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="480" y="107" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Load Balance</text>
  </g>

  <!-- Sub Node: External Call (Flagged as Danger) -->
  <line x1="515" y1="210" x2="610" y2="210" stroke="#ef4444" stroke-width="2"/>
  <g class="node">
    <rect x="610" y="180" width="140" height="60" rx="8" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="2"/>
    <text x="680" y="202" font-family="sans-serif" font-size="11" fill="#fca5a5" font-weight="bold" text-anchor="middle">External CALL</text>
    <text x="680" y="218" font-family="monospace" font-size="9" fill="#ef4444" text-anchor="middle">Reentrancy Vector</text>
    <text x="680" y="232" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle">Classification Conf: 99.4%</text>
  </g>

  <!-- Sub Node: Update Balance -->
  <line x1="480" y1="245" x2="480" y2="340" stroke="#f59e0b" stroke-width="2"/>
  <g class="node">
    <rect x="410" y="340" width="140" height="35" rx="6" fill="rgba(245, 158, 11, 0.1)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="480" y="362" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">State Assignment</text>
  </g>

  <!-- Flow Arrows / Logic feedback -->
  <path d="M 680 240 Q 610 300 550 350" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="545,354 554,349 550,345" fill="#ef4444" />

  <text x="610" y="310" font-family="sans-serif" font-size="9" fill="#fca5a5" font-weight="bold">Out of Order State Update</text>
</svg>
